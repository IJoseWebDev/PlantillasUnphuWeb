<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Directorio de landings institucionales de la UNPHU." />
    <meta name="theme-color" content="#156b1d" />
    <title>Directorio de Landings — UNPHU</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/directorio.css" />
</head>
<body class="min-h-screen bg-[#f5f7f4] text-[#191c1d] antialiased">
    <main>
        <section class="relative overflow-hidden bg-gradient-to-br from-[#0a3859] via-[#156b1d] to-[#338534] text-white">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(255,255,255,0.16),_transparent_40%)]"></div>
            <div class="relative mx-auto flex max-w-7xl flex-col gap-8 px-6 py-20 lg:px-8 lg:py-24">
                <h1 class="text-4xl font-bold leading-tight sm:text-5xl">Directorio de landings</h1>
                <div>
                    <a href="README.md" class="inline-flex items-center justify-center rounded-full border border-white/30 px-6 py-3 font-semibold text-white transition hover:bg-white/10">
                        Leer documentación
                    </a>
                </div>
            </div>
        </section>

        <section class="mx-auto max-w-7xl px-6 py-16 lg:px-8">
            <div class="mb-8 flex flex-col gap-4 lg:flex-row lg:items-end">
                <form class="dir-search flex-1" role="search" aria-label="Buscar landing" onsubmit="return false;">
                    <span class="material-symbols-outlined dir-search__icon" aria-hidden="true">search</span>
                    <input
                        type="search"
                        id="dir-search"
                        class="dir-search__input"
                        placeholder="Escribe el nombre del landing"
                        autocomplete="off"
                        aria-label="Buscar landing por nombre"
                    />
                </form>
                <div class="dir-sort">
                    <label for="dir-sort">Organizar</label>
                    <select id="dir-sort" aria-label="Organizar landings">
                        <option value="recent">Más recientes</option>
                        <option value="oldest">Más antiguos</option>
                        <option value="alpha-asc">Alfabético A–Z</option>
                        <option value="alpha-desc">Alfabético Z–A</option>
                    </select>
                </div>
            </div>

            <p id="dir-count" class="mb-6 text-sm text-[#40493d]" aria-live="polite"></p>
            <div id="dir-grid" class="dir-grid"></div>
            <p id="dir-empty" class="dir-empty" hidden>No hay landings con ese nombre.</p>
        </section>
    </main>

    <script src="assets/js/directorio.js"></script>
</body>
</html>
