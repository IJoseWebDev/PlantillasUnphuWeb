<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Página 404 UNPHU - URL no válida" />
    <meta name="theme-color" content="#156b1d" />
    <title>UNPHU — Universidad Nacional Pedro Henríquez Ureña </title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Tailwind Config -->
    <script id="tailwind-config" src="../assets/js/tailwind-config.js"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/404-unphu.css" />
</head>
<body class="bg-background text-on-background font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

<div class="not-found-owl">
    <img
        src="../assets/images/olvivo.png"
        alt="Búho UNPHU con megáfono"
        class="not-found-owl__image"
    />
    <div class="not-found-owl__bubble">
        <img
            src="../assets/images/noFound.png"
            alt="Página no encontrada"
            class="not-found-owl__bubble-image"
        />
    </div>
</div>

<section class="not-found-page relative overflow-hidden py-8 md:py-16" data-animate="fade">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(22,100,57,0.20),_transparent_45%),radial-gradient(circle_at_bottom_right,_rgba(3,68,29,0.18),_transparent_30%)]"></div>

    <div class="not-found-page__content relative z-20 max-w-container-max mx-auto md:px-stack-lg">
        <div class="mx-auto max-w-screen-lg">
            <div class="text-center lg:px-8">
                <div class="mx-auto mb-6 w-[7rem] sm:mb-8 sm:w-[8rem] lg:w-[9rem]">
                    <a href="https://www.unphu.edu.do/" rel="noopener noreferrer" class="inline-block">
                        <img src="https://unphu.edu.do/logo-unphu-60-aniversario.png" alt="Logo UNPHU 60 Aniversario" class="mx-auto w-full width object-contain" />
                    </a>
                </div>
                <p class="not-found-page__title font-display-xl text-primary text-center type-item-title">Url no válida</p>
                <h1 class="not-found-page__heading type-item-title text-center font-display-lg text-on-background mb-4">Error 404</h1>
                <p class="not-found-page__description mx-auto mb-8 sm:mb-10 text-on-background/80 lg:mx-auto">
                    La página que buscas no existe o ha sido movida dentro de nuestro sitio institucional.
                </p>
                <div class="flex justify-center">
                    <a href="https://www.unphu.edu.do/" class="not-found-page__cta inline-flex items-center gap-2 sm:gap-3 rounded-full bg-[#074013] font-label-bold uppercase text-white shadow-[0_18px_45px_rgba(0,0,0,0.18)] transition-all duration-200 hover:bg-[#062b0f] hover:scale-105">
                        <span class="material-symbols-outlined text-[1.125rem] sm:text-[1.25rem]">home</span>
                        VOLVER A PÁGINA PRINCIPAL
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Config global -->
<script src="../config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/animations.js"></script>
<script src="../assets/js/common.js"></script>
</body>
</html>
