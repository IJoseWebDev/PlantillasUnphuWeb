<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Detalle de vacante — Bolsa de Empleo UNPHU"/>
    <meta name="theme-color" content="#156b1d"/>
    <title>Detalle de Vacante — Bolsa de Empleo UNPHU</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config" src="../assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../assets/css/global.css"/>
    <link rel="stylesheet" href="../assets/css/bolsa-de-empleo.css"/>
</head>
<body class="bg-background text-on-background font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

<!--
  PÁGINA: Detalle de Vacante
  Next.js route sugerida: /bolsa-de-empleo/[id]
  Query param actual: ?id=VAC-2024-DATA-02
  Componentes: JobBreadcrumb, JobDetailHeader, JobQuickInfo, JobDescription,
               JobRequirements, AcademicProfileCard, CompensationCard, ApplicationCard
-->

<main>

    <section class="py-section-padding bg-background" data-component="JobDetailPage">
        <div class="max-w-container-max mx-auto px-gutter md:px-stack-lg">

            <!-- Component: JobBreadcrumb -->
            <nav class="job-breadcrumb mb-8" aria-label="Ruta de navegación" data-component="JobBreadcrumb">
                <a href="/">Inicio</a>
                <span class="job-breadcrumb__separator" aria-hidden="true">›</span>
                <a href="bolsa-de-empleo.html">Bolsa de empleo</a>
                <span class="job-breadcrumb__separator" aria-hidden="true">›</span>
                <span class="job-breadcrumb__current" id="job-breadcrumb-current">Cargando…</span>
            </nav>

            <!-- Contenedor principal — renderizado dinámico -->
            <div id="job-detail-content" data-component="JobDetailContent" aria-live="polite">
                <!-- Renderizado via landing-bolsa-de-empleo.js según ?id= -->
            </div>

            <!-- Enlace de regreso -->
            <div class="mt-8 pt-6 border-t border-outline-variant">
                <a href="bolsa-de-empleo.html" class="job-back-link inline-flex items-center gap-2 type-body-md font-semibold">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Volver al listado de vacantes
                </a>
            </div>

        </div>
    </section>

</main>

<script src="../config.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/animations.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/landing-bolsa-de-empleo.js"></script>
</body>
</html>
